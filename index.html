<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#087f5b">
  <meta name="description" content="MENA — Connect, Discover and Grow">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <title>MENA</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">

    <button
      class="brand"
      data-page="home"
      aria-label="MENA home"
      type="button"
    >
      <span class="logo">M</span>
      <strong>MENA</strong>
    </button>

    <div class="top-actions">

      <button
        id="searchBtn"
        class="circle"
        aria-label="Search"
        type="button"
      >
        ⌕
      </button>

      <button
        id="settingsBtn"
        class="circle"
        aria-label="Settings"
        type="button"
      >
        ⚙
      </button>

    </div>

  </header>


  <!-- MAIN APP -->
  <main id="app" aria-live="polite"></main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button
      data-page="home"
      type="button"
    >
      <span>⌂</span>
      <small>Home</small>
    </button>

    <button
      data-page="market"
      type="button"
    >
      <span>🛍</span>
      <small>Market</small>
    </button>

    <button
      id="createBtn"
      class="create"
      type="button"
      aria-label="Create"
    >
      ＋
    </button>

    <button
      data-page="work"
      type="button"
    >
      <span>💼</span>
      <small>Free Work</small>
    </button>

    <button
      data-page="profile"
      type="button"
    >
      <span>◉</span>
      <small>Profile</small>
    </button>

  </nav>


  <!-- MEDIA UPLOAD -->
  <input
    id="mediaInput"
    type="file"
    accept="image/*,video/*"
    capture="environment"
    hidden
  >


  <!-- MODAL -->
  <div
    id="modal"
    class="modal hidden"
    aria-hidden="true"
  ></div>


  <!-- MENA JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
