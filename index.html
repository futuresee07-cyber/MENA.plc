<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#087f5b">
<title>MENA — Connect. Discover. Grow.</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --green:#087f5b;
  --green2:#0aa878;
  --dark:#10251f;
  --text:#18211e;
  --muted:#77827e;
  --bg:#f4f7f6;
  --white:#fff;
  --line:#e5ebe8;
  --danger:#e94b62;
  --shadow:0 8px 28px rgba(16,37,31,.08);
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:82px;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  border:0;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.hidden{
  display:none!important;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
}

/* TOP BAR */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:68px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
}

.logo{
  font-size:27px;
  font-weight:900;
  color:var(--green);
  letter-spacing:-1px;
}

.logo span{
  color:#17bf91;
}

.search{
  flex:1;
  height:42px;
  background:#f0f4f2;
  border-radius:22px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 13px;
  color:#6c7773;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  font-size:14px;
}

.top-icon{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#f0f4f2;
  font-size:18px;
}

/* PAGES */

.page{
  display:none;
  padding:18px 14px 25px;
}

.page.active{
  display:block;
}

.welcome{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.small-text{
  color:var(--muted);
  font-size:13px;
  margin-bottom:4px;
}

.welcome h1,
.page-heading h1{
  font-size:25px;
  letter-spacing:-.5px;
}

.online-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#1cc88a;
  box-shadow:0 0 0 5px #dff8ee;
}

/* STORIES */

.stories{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:3px 1px 13px;
  scrollbar-width:none;
}

.stories::-webkit-scrollbar{
  display:none;
}

.story{
  min-width:68px;
  text-align:center;
}

.story-circle{
  width:61px;
  height:61px;
  border-radius:50%;
  margin:auto;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:27px;
  color:white;
  background:linear-gradient(135deg,#075b43,#16b887);
  border:3px solid white;
  box-shadow:0 0 0 2px #11a77e;
}

.story .person{
  background:#dcece6;
  color:#18382f;
}

.story span{
  display:block;
  margin-top:6px;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* SECTIONS */

.section{
  margin-top:17px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h2{
  font-size:18px;
}

.section-title p{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.section-title button{
  color:var(--green);
  background:transparent;
  font-weight:bold;
}

/* LIVE ROW */

.live-row{
  display:flex;
  gap:12px;
  overflow-x:auto;
  scrollbar-width:none;
}

.live-row::-webkit-scrollbar{
  display:none;
}

.live-card{
  min-width:145px;
  background:white;
  border-radius:17px;
  padding:9px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.live-photo{
  height:120px;
  border-radius:12px;
  background:linear-gradient(135deg,#103c30,#18ae82);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
}

.live-badge{
  position:absolute;
  top:16px;
  left:16px;
  background:#ef3854;
  color:white;
  border-radius:5px;
  padding:4px 7px;
  font-size:9px;
  font-weight:bold;
}

.live-card h3{
  font-size:14px;
  margin:8px 3px 3px;
}

.live-card p{
  color:var(--muted);
  font-size:11px;
  margin-left:3px;
}

/* POSTS */

.post{
  background:white;
  border-radius:19px;
  margin-bottom:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
  border:1px solid #edf1ef;
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:linear-gradient(135deg,#10382e,#13a87d);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.post-user{
  flex:1;
}

.post-user b{
  font-size:14px;
}

.post-user small{
  display:block;
  color:var(--muted);
  margin-top:3px;
}

.more{
  background:transparent;
  font-size:20px;
  color:#68746f;
}

.post-text{
  padding:0 14px 12px;
  line-height:1.5;
  font-size:14px;
}

.post-image{
  min-height:270px;
  background:linear-gradient(135deg,#063e30,#0a9069,#36c59c);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:55px;
}

.post-image.market{
  background:linear-gradient(135deg,#18372f,#2aa77e);
}

.post-image.video{
  background:linear-gradient(135deg,#121b19,#087f5b);
}

.post-actions{
  display:flex;
  align-items:center;
  padding:9px 10px;
  gap:3px;
  border-top:1px solid #eef2f0;
}

.post-actions button{
  background:transparent;
  padding:8px 9px;
  border-radius:10px;
  color:#55615d;
  font-size:13px;
}

.post-actions button:hover{
  background:#eef7f3;
  color:var(--green);
}

.like-count{
  color:var(--muted);
  font-size:12px;
  margin-left:auto;
  padding-right:8px;
}

/* PAGE HEADING */

.page-heading{
  margin-bottom:20px;
}

.page-heading p:last-child{
  color:var(--muted);
  margin-top:6px;
  font-size:13px;
}

/* MARKET */

.market-tabs{
  background:white;
  padding:5px;
  border-radius:14px;
  display:flex;
  gap:4px;
  box-shadow:var(--shadow);
  margin-bottom:15px;
}

.market-tabs button{
  flex:1;
  padding:12px 8px;
  border-radius:10px;
  background:transparent;
  color:#65716d;
  font-weight:bold;
}

.market-tabs button.active{
  background:var(--green);
  color:white;
}

.category-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:18px;
  scrollbar-width:none;
}

.category-row::-webkit-scrollbar{
  display:none;
}

.category-row button{
  white-space:nowrap;
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:9px 13px;
  font-size:12px;
}

.category-row button:first-child{
  background:#e1f5ed;
  color:var(--green);
  border-color:#bce8d8;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.product{
  background:white;
  border-radius:17px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.product-image{
  height:145px;
  background:#edf3f0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:57px;
}

.product-info{
  padding:12px;
}

.product-info h3{
  font-size:14px;
  margin-bottom:6px;
}

.price{
  color:var(--green);
  font-weight:900;
  font-size:15px;
}

.location{
  color:var(--muted);
  font-size:11px;
  margin:6px 0;
}

.view-button{
  width:100%;
  padding:9px;
  border-radius:9px;
  background:#e8f6f1;
  color:var(--green);
  font-weight:bold;
  margin-top:4px;
}

/* FEE */

.fee-box{
  background:linear-gradient(135deg,#073e30,#0b8b67);
  color:white;
  border-radius:17px;
  margin-top:18px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:13px;
}

.fee-icon{
  width:45px;
  height:45px;
  border-radius:13px;
  background:#ffffff1c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.fee-box h3{
  font-size:14px;
}

.fee-box p{
  font-size:12px;
  opacity:.85;
  margin-top:4px;
}

/* WORK */

.work-banner{
  background:linear-gradient(135deg,#0b654b,#13ad82);
  color:white;
  border-radius:19px;
  padding:22px;
  margin-bottom:15px;
}

.work-banner span{
  font-size:30px;
}

.work-banner h2{
  margin:9px 0 5px;
}

.work-banner p{
  opacity:.85;
  font-size:13px;
}

.job-search{
  width:100%;
  height:45px;
  background:white;
  border:1px solid var(--line);
  border-radius:13px;
  padding:0 14px;
  outline:none;
  margin-bottom:13px;
}

.job-card{
  display:flex;
  gap:12px;
  background:white;
  border-radius:17px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}

.job-icon{
  width:48px;
  height:48px;
  flex:none;
  border-radius:13px;
  background:#e8f6f1;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:23px;
}

.job-card h3{
  font-size:15px;
}

.job-card p{
  color:var(--muted);
  font-size:12px;
  margin:5px 0;
  line-height:1.4;
}

.job-card small{
  color:#52615c;
  font-size:11px;
}

.job-card button{
  display:block;
  background:var(--green);
  color:white;
  padding:8px 12px;
  border-radius:8px;
  margin-top:9px;
  font-size:12px;
}

.big-create{
  width:100%;
  padding:13px;
  border-radius:12px;
  background:#e6f6f0;
  color:var(--green);
  font-weight:bold;
  margin-top:12px;
}

/* CREATE */

.create-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.create-grid button{
  text-align:left;
  min-height:150px;
  background:white;
  border-radius:19px;
  padding:18px;
  box-shadow:var(--shadow);
  border:1px solid #e9efec;
}

.create-grid span{
  display:block;
  font-size:31px;
  margin-bottom:18px;
}

.create-grid b{
  display:block;
  font-size:15px;
}

.create-grid small{
  display:block;
  color:var(--muted);
  margin-top:6px;
  line-height:1.3;
}

/* LIVE PAGE */

.stream-card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
  margin-bottom:15px;
}

.stream-screen{
  height:280px;
  background:linear-gradient(135deg,#092c24,#087f5b
